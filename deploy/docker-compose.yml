# =============================================================================
# Despliegue autoalojado de la Plataforma MEAL (DRT 14.2, 100% open source)
#
# Componentes:
#   web      → PWA compilada (dist/) servida por nginx.
#   backend  → Supabase autoalojado (open source). Se instala con el stack
#              oficial de Supabase (ver instrucciones abajo) en el mismo VPS
#              con residencia de datos en Colombia (Ley 1581/2012).
#
# Pasos:
#   1. npm run build                     (genera dist/)
#   2. docker compose -f deploy/docker-compose.yml up -d
#   3. Backend: git clone --depth 1 https://github.com/supabase/supabase
#      cd supabase/docker && cp .env.example .env   (definir secretos propios)
#      docker compose up -d
#   4. Aplicar migraciones:  psql "$DATABASE_URL" -f supabase/migrations/001_schema.sql
#                            psql "$DATABASE_URL" -f supabase/migrations/002_rls.sql
#                            psql "$DATABASE_URL" -f supabase/migrations/003_audit_triggers.sql
#   5. Configurar VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY y recompilar la PWA.
#
# Respaldos (RNF-14): el servicio backup hace pg_dump diario con retención local.
# =============================================================================

services:
  web:
    image: nginx:1.27-alpine
    container_name: meal-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Respaldo diario de la base de datos del backend Supabase (pg_dump)
  backup:
    image: postgres:16-alpine
    container_name: meal-backup
    restart: unless-stopped
    environment:
      # Apuntar a la BD del stack Supabase autoalojado
      PGHOST: ${PGHOST:-host.docker.internal}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?definir PGPASSWORD en .env}
      PGDATABASE: ${PGDATABASE:-postgres}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        FECHA=$$(date +%Y%m%d-%H%M);
        pg_dump -Fc -f /backups/meal-$$FECHA.dump &&
        echo "[backup] meal-$$FECHA.dump OK";
        find /backups -name "meal-*.dump" -mtime +30 -delete;
        sleep 86400;
      done'
