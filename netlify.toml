# Netlify: compila la PWA y publica la función que guarda las fotos de
# evidencia cuando el backend es Neon (netlify/functions/evidencias.mjs).
# Las variables VITE_NEON_* (o VITE_SUPABASE_*) se definen en
# Site configuration → Environment variables (ver docs/MIGRACION_NEON.md).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Mismas cabeceras de caché que deploy/nginx.conf: el service worker y su
# registro nunca se cachean (si no, los dispositivos quedan con una versión
# vieja de la app); los assets con hash sí, para siempre.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
