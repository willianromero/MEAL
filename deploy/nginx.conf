# nginx para la PWA MEAL: SPA fallback + cabeceras correctas para el
# service worker y los assets versionados.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS: en producción terminar HTTPS aquí o delante (Caddy/Traefik/certbot).
    # RNF-6 exige TLS 1.2+ en todas las comunicaciones.

    # El service worker no debe cachearse (auto-update de la PWA)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre: cache inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
